AWSTemplateFormatVersion: '2010-09-09'
Description: >
  AWS Discovery Orchestrator — AgentCore Runtime, presign API,
  S3/CloudFront frontend, DynamoDB session storage

Parameters:
  EcrImageUri:
    Type: String
    Description: >
      ECR image URI for the agent container,
      e.g. 123456789012.dkr.ecr.us-east-1.amazonaws.com/aws-discovery-agent:latest
  DeployTimestamp:
    Type: String
    Default: '0'
    Description: Change this value to force a runtime redeployment
  DemoPasswordB64:
    Type: String
    Default: ''
    NoEcho: true
    Description: >
      Base64-encoded 'demo:<password>' for HTTP Basic Auth.
      Generated by deploy.sh --password. Leave empty to disable auth.
  EnableWAF:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Enable AWS WAF with rate limiting on CloudFront

  # ── AWS CDS (Communication Developer Services) configuration ──
  SandboxMode:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >
      When 'true', channel adapters record intended sends instead of calling CDS
      (SES / End User Messaging). Set 'false' once SES identity + SMS number exist.
  SesSenderEmail:
    Type: String
    Default: ''
    Description: >
      Verified Amazon SES "From" address for report emails
      (e.g. no-reply@your-domain.com). Required for real email sends.
  SmsOriginationIdentity:
    Type: String
    Default: ''
    Description: >
      AWS End User Messaging origination identity (phone number ARN/ID, pool ID,
      or sender ID) used to send SMS/RCS. Required for real messaging sends.
  FollowUpChannel:
    Type: String
    Default: 'sms'
    AllowedValues: ['sms', 'rcs']
    Description: Channel used for the interactive post-call follow-up message.
  DemoEmail:
    Type: String
    Default: ''
    Description: Fallback report recipient email for demo sessions (optional).
  DemoPhone:
    Type: String
    Default: ''
    Description: Fallback follow-up recipient phone (E.164) for demo sessions (optional).

Conditions:
  WAFEnabled: !Equals [!Ref EnableWAF, 'true']
  HasSesSender: !Not [!Equals [!Ref SesSenderEmail, '']]

Resources:

  # ────────────────────────────────────────────────────────────────
  # DynamoDB — session records (transcripts, reports, metadata)
  # ────────────────────────────────────────────────────────────────
  SessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: aws-discovery-sessions
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: session_id
          AttributeType: S
      KeySchema:
        - AttributeName: session_id
          KeyType: HASH
      # Conversation-state records carry a `ttl` so customer contact data
      # auto-expires (privacy / data-minimization — see SPRINT_PLAN threat model).
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ════════════════════════════════════════════════════════════════
  # AWS CDS — Amazon SES verified sender identity (email channel)
  # ════════════════════════════════════════════════════════════════
  ReportSenderIdentity:
    Type: AWS::SES::EmailIdentity
    Condition: HasSesSender
    Properties:
      EmailIdentity: !Ref SesSenderEmail

  # ════════════════════════════════════════════════════════════════
  # AWS CDS — inbound two-way messaging
  #   AWS End User Messaging publishes inbound SMS/RCS replies to this SNS
  #   topic; the inbound Lambda runs one agentic turn per message.
  #   Wire the topic to a number's two-way config in the EUM console (or CLI)
  #   after deploy — ARN is exported below.
  # ════════════════════════════════════════════════════════════════
  InboundTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: aws-discovery-inbound

  InboundLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: aws-discovery-inbound-lambda-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: InboundPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Reply over CDS (SMS/RCS) and, if needed, email
              - Effect: Allow
                Action:
                  - sms-voice:SendTextMessage
                  - ses:SendEmail
                Resource: "*"
              # Agentic intent routing + grounded answers via Bedrock
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource:
                  - !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.nova*"
              # Conversation state
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt SessionsTable.Arn

  # NOTE: This inline handler is a self-contained demo of the inbound agentic
  # loop. The production handler is infra/inbound_lambda.py, which reuses the
  # agent/engagement package verbatim — package agent/ with the Lambda (e.g. a
  # container image or a zip built by deploy.sh) and point Handler at
  # inbound_lambda.handler. See DEPLOYMENT.md.
  InboundLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: aws-discovery-inbound
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt InboundLambdaRole.Arn
      Timeout: 30
      Environment:
        Variables:
          AWS_DEFAULT_REGION_HINT: !Ref AWS::Region
          SANDBOX_MODE: !Ref SandboxMode
          SMS_ORIGINATION_IDENTITY: !Ref SmsOriginationIdentity
          DYNAMODB_TABLE: !Ref SessionsTable
      Code:
        ZipFile: |
          # Self-contained demo inbound handler. Mirrors agent/engagement:
          # verify -> load state -> classify (keyword) -> act -> reply.
          # Production uses infra/inbound_lambda.py with the full agent package.
          import json, os, logging, boto3
          log = logging.getLogger(); log.setLevel(logging.INFO)
          REGION = os.environ.get("AWS_DEFAULT_REGION_HINT", "us-east-1")
          TABLE = os.environ.get("DYNAMODB_TABLE", "aws-discovery-sessions")
          SANDBOX = os.environ.get("SANDBOX_MODE", "true").lower() in ("1","true","yes")
          ORIG = os.environ.get("SMS_ORIGINATION_IDENTITY", "")

          def classify(text):
              t = (text or "").strip().lower()
              if t in ("1","one") or "book" in t or "deep" in t: return "book_deepdive"
              if t in ("2","two") or "cost" in t or "price" in t: return "cost_estimate"
              if t in ("3","three") or "human" in t or "call" in t: return "talk_to_human"
              if "?" in t: return "ask_question"
              return "unknown"

          REPLIES = {
            "book_deepdive": "Great - reply with a day and time and an architect will confirm a slot.",
            "cost_estimate": "Your report has a per-service cost breakdown. Reply 1 to book a walkthrough.",
            "talk_to_human": "Flagged for an architect - they will reach out shortly.",
            "ask_question": "Good question - the key points are in your report summary. Reply 1 to book a deep-dive.",
            "unknown": "You can reply: 1 Book a deep-dive, 2 See cost estimate, 3 Talk to a human.",
          }

          def mask(addr):
              d = [c for c in (addr or "") if c.isdigit()]
              return "***" + "".join(d[-4:]) if len(d) >= 4 else "***"

          def handler(event, context):
              ddb = boto3.resource("dynamodb", region_name=REGION).Table(TABLE)
              sms = boto3.client("pinpoint-sms-voice-v2", region_name=REGION) if not SANDBOX else None
              out = []
              for rec in event.get("Records", []):
                  try:
                      payload = json.loads(rec["Sns"]["Message"])
                  except Exception:
                      continue
                  sender = payload.get("originationNumber") or payload.get("from") or ""
                  text = payload.get("messageBody") or payload.get("body") or ""
                  if not sender or not text:
                      continue
                  cid = f"sms:{sender.strip().lower()}"
                  item = ddb.get_item(Key={"session_id": cid}).get("Item")
                  if not item:
                      log.info("no conversation state for %s; ignoring", mask(sender))
                      continue
                  action = classify(text)
                  reply = REPLIES.get(action, REPLIES["unknown"])
                  reply_to = (item.get("channels") or {}).get("sms", sender)
                  if SANDBOX or not ORIG:
                      log.info("[sandbox] would reply to %s: %s", mask(reply_to), reply[:60])
                  else:
                      sms.send_text_message(DestinationPhoneNumber=reply_to,
                                            OriginationIdentity=ORIG, MessageBody=reply)
                  item["stage"] = {"book_deepdive":"booking_requested","cost_estimate":"shared_cost",
                                   "talk_to_human":"handoff_requested"}.get(action, item.get("stage","awaiting_choice"))
                  ddb.put_item(Item=item)
                  out.append({"sender": mask(sender), "action": action})
              return {"statusCode": 200, "body": json.dumps({"processed": len(out), "results": out})}

  InboundTopicSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref InboundTopic
      Protocol: lambda
      Endpoint: !GetAtt InboundLambda.Arn

  InboundLambdaSnsPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref InboundLambda
      Action: lambda:InvokeFunction
      Principal: sns.amazonaws.com
      SourceArn: !Ref InboundTopic

  # ────────────────────────────────────────────────────────────────
  # AgentCore Runtime — IAM execution role
  # ────────────────────────────────────────────────────────────────
  AgentRuntimeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: aws-discovery-agent-runtime-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock-agentcore.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AgentRuntimePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # ECR — pull container image
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchCheckLayerAvailability
                Resource: !Sub "arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/aws-discovery-agent"

              # Bedrock — Nova Sonic (streaming) + Nova Pro (report)
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                  - bedrock:InvokeModelWithBidirectionalStream
                Resource:
                  - !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.nova*"
                  - !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/anthropic.*"

              # Bedrock Knowledge Base (RAG)
              - Effect: Allow
                Action:
                  - bedrock:Retrieve
                  - bedrock:RetrieveAndGenerate
                Resource: !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/*"

              # DynamoDB — session records
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource: !GetAtt SessionsTable.Arn

              # AWS CDS — Amazon SES (send the discovery report by email)
              - Effect: Allow
                Action:
                  - ses:SendEmail
                Resource: "*"

              # AWS CDS — End User Messaging (send SMS / RCS follow-up)
              - Effect: Allow
                Action:
                  - sms-voice:SendTextMessage
                Resource: "*"

              # CloudWatch Logs
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/*"

              # X-Ray
              - Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                  - xray:GetSamplingRules
                  - xray:GetSamplingTargets
                Resource: "*"

              # CloudWatch Metrics
              - Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: "*"
                Condition:
                  StringEquals:
                    cloudwatch:namespace: bedrock-agentcore

  # ────────────────────────────────────────────────────────────────
  # AgentCore Runtime
  # ────────────────────────────────────────────────────────────────
  AgentRuntime:
    Type: AWS::BedrockAgentCore::Runtime
    Properties:
      AgentRuntimeName: awsDiscoveryAgent
      Description: AWS Discovery Orchestrator — architecture discovery interview agent (Nova 2 Sonic + Nova Pro)
      AgentRuntimeArtifact:
        ContainerConfiguration:
          ContainerUri: !Ref EcrImageUri
      NetworkConfiguration:
        NetworkMode: PUBLIC
      ProtocolConfiguration: HTTP
      RoleArn: !GetAtt AgentRuntimeRole.Arn
      EnvironmentVariables:
        AWS_DEFAULT_REGION: !Ref AWS::Region
        DYNAMODB_TABLE: !Ref SessionsTable
        DEPLOY_VERSION: !Ref DeployTimestamp
        # ── AWS CDS omnichannel engagement ──
        SANDBOX_MODE: !Ref SandboxMode
        SES_SENDER_EMAIL: !Ref SesSenderEmail
        SMS_ORIGINATION_IDENTITY: !Ref SmsOriginationIdentity
        FOLLOW_UP_CHANNEL: !Ref FollowUpChannel
        DEMO_EMAIL: !Ref DemoEmail
        DEMO_PHONE: !Ref DemoPhone

  # ────────────────────────────────────────────────────────────────
  # Presign Lambda — generates SigV4 presigned WSS URL
  # ────────────────────────────────────────────────────────────────
  PresignLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: aws-discovery-presign-lambda-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: PresignPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock-agentcore:InvokeAgentRuntime
                  - bedrock-agentcore:InvokeAgentRuntimeWithWebSocketStream
                  - bedrock-agentcore:InvokeRuntime
                  - bedrock-agentcore:InvokeRuntimeWithResponseStream
                Resource: "*"

  PresignLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: aws-discovery-presign
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt PresignLambdaRole.Arn
      Timeout: 10
      Environment:
        Variables:
          RUNTIME_ARN: !GetAtt AgentRuntime.AgentRuntimeArn
          REGION: !Ref AWS::Region
          DEMO_TOKEN: !Ref DemoPasswordB64
      Code:
        ZipFile: |
          import json, os, uuid, boto3
          from urllib.parse import quote, urlencode
          from botocore.auth import SigV4QueryAuth
          from botocore.awsrequest import AWSRequest

          def handler(event, context):
              method = event.get('requestContext', {}).get('http', {}).get('method', 'POST')
              if method == 'OPTIONS':
                  return {
                      'statusCode': 200,
                      'headers': {
                          'Access-Control-Allow-Origin': '*',
                          'Access-Control-Allow-Methods': 'POST,OPTIONS',
                          'Access-Control-Allow-Headers': 'Content-Type,x-demo-token',
                      },
                      'body': '',
                  }

              demo_token = os.environ.get('DEMO_TOKEN', '')
              if demo_token:
                  headers = event.get('headers', {})
                  req_token = headers.get('x-demo-token', '')
                  if req_token != demo_token:
                      return {
                          'statusCode': 403,
                          'headers': {
                              'Content-Type': 'application/json',
                              'Access-Control-Allow-Origin': '*',
                          },
                          'body': json.dumps({'error': 'Forbidden'}),
                      }

              region = os.environ['REGION']
              runtime_arn = os.environ['RUNTIME_ARN']

              session = boto3.Session()
              creds = session.get_credentials().get_frozen_credentials()

              host = f'bedrock-agentcore.{region}.amazonaws.com'
              encoded_arn = quote(runtime_arn, safe='')
              session_id = str(uuid.uuid4())
              qs = urlencode({
                  'qualifier': 'DEFAULT',
                  'X-Amzn-Bedrock-AgentCore-Runtime-Session-Id': session_id,
              })
              url = f'https://{host}/runtimes/{encoded_arn}/ws?{qs}'

              request = AWSRequest(method='GET', url=url, headers={'host': host})
              auth = SigV4QueryAuth(creds, 'bedrock-agentcore', region, expires=300)
              auth.add_auth(request)

              ws_url = str(request.url).replace('https://', 'wss://')

              return {
                  'statusCode': 200,
                  'headers': {
                      'Content-Type': 'application/json',
                      'Access-Control-Allow-Origin': '*',
                  },
                  'body': json.dumps({'wsUrl': ws_url}),
              }

  # ────────────────────────────────────────────────────────────────
  # API Gateway HTTP — POST /presign
  # ────────────────────────────────────────────────────────────────
  PresignApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: aws-discovery-presign-api
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - x-demo-token

  PresignApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref PresignApi
      StageName: $default
      AutoDeploy: true

  PresignIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref PresignApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${PresignLambda.Arn}/invocations"
      PayloadFormatVersion: "2.0"

  PresignRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref PresignApi
      RouteKey: "POST /presign"
      Target: !Sub "integrations/${PresignIntegration}"

  PresignLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref PresignLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${PresignApi}/*/*/presign"

  # ────────────────────────────────────────────────────────────────
  # S3 — frontend bucket (private, served via CloudFront OAC)
  # ────────────────────────────────────────────────────────────────
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "aws-discovery-frontend-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: aws-discovery-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}"

  # ────────────────────────────────────────────────────────────────
  # CloudFront Function — HTTP Basic Auth for demo
  # ────────────────────────────────────────────────────────────────
  BasicAuthFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: aws-discovery-basic-auth
      AutoPublish: true
      FunctionConfig:
        Comment: HTTP Basic Auth for demo access
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub |
        var EXPECTED = '${DemoPasswordB64}';
        function handler(event) {
          if (!EXPECTED) return event.request;
          var auth = (event.request.headers.authorization || {}).value || '';
          if (auth === 'Basic ' + EXPECTED) return event.request;
          return {
            statusCode: 401,
            statusDescription: 'Unauthorized',
            headers: { 'www-authenticate': { value: 'Basic realm="AWS Discovery demo"' } },
            body: { encoding: 'text', data: 'Unauthorized' }
          };
        }

  # ────────────────────────────────────────────────────────────────
  # WAF — rate limiting (optional)
  # ────────────────────────────────────────────────────────────────
  WAFWebACL:
    Type: AWS::WAFv2::WebACL
    Condition: WAFEnabled
    Properties:
      Name: aws-discovery-waf
      Scope: CLOUDFRONT
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: aws-discovery-waf
      Rules:
        - Name: rate-limit-per-ip
          Priority: 1
          Action:
            Block: {}
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: aws-discovery-rate-limit
          Statement:
            RateBasedStatement:
              Limit: 300
              AggregateKeyType: IP
        - Name: aws-managed-common-rules
          Priority: 2
          OverrideAction:
            None: {}
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: aws-discovery-common-rules
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet

  # ────────────────────────────────────────────────────────────────
  # CloudFront — HTTPS frontend
  # ────────────────────────────────────────────────────────────────
  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        DefaultRootObject: index.html
        Enabled: true
        HttpVersion: http2
        WebACLId: !If [WAFEnabled, !GetAtt WAFWebACL.Arn, !Ref 'AWS::NoValue']
        Origins:
          - Id: s3-frontend
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !Ref FrontendOAC
            S3OriginConfig: {}
        DefaultCacheBehavior:
          TargetOriginId: s3-frontend
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # CachingOptimized
          AllowedMethods: [GET, HEAD, OPTIONS]
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt BasicAuthFunction.FunctionMetadata.FunctionARN
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

Outputs:
  FrontendUrl:
    Description: CloudFront URL for the frontend
    Value: !Sub "https://${FrontendDistribution.DomainName}"

  PresignApiUrl:
    Description: API Gateway URL for presigning WebSocket connections
    Value: !Sub "https://${PresignApi}.execute-api.${AWS::Region}.amazonaws.com/presign"

  FrontendBucketName:
    Description: S3 bucket name for frontend assets
    Value: !Ref FrontendBucket

  RuntimeArn:
    Description: AgentCore Runtime ARN
    Value: !GetAtt AgentRuntime.AgentRuntimeArn

  SessionsTableName:
    Description: DynamoDB table for session storage
    Value: !Ref SessionsTable

  InboundTopicArn:
    Description: >
      SNS topic for inbound two-way messages. Set this as the two-way SNS
      destination on your AWS End User Messaging phone number / RCS agent.
    Value: !Ref InboundTopic
